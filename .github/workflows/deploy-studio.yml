# Publishes the standalone WebAssembly Studio (RogueDeck.Studio.Web) to GitHub Pages on every push to main that
# touches source, serving it at https://studio.moonvineforge.com (CNAME written below; DNS points the subdomain
# at paranoidgrinch.github.io). The Studio is fully client-side — Pages only hands out static files.
name: Deploy Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/deploy-studio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish the WebAssembly Studio
        run: dotnet publish src/RogueDeck.Studio.Web -c Release -o publish

      - name: Shape the site for Pages
        run: |
          # Jekyll would drop the _framework folder (leading underscore); opt out entirely.
          touch publish/wwwroot/.nojekyll
          # Client-side routing: any deep link (e.g. /cards) 404s on a static host — serve the app instead.
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          # The custom domain Pages serves this site on.
          echo studio.moonvineforge.com > publish/wwwroot/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
